<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Under One Light</title>
<link rel="stylesheet" href="./base.css" />
<style>
  body { background: #070707; color: #ecebe7; }
  /* one spotlight from above, falling on the print in the middle */
  .light { position: absolute; left: 50%; top: -120px; width: 1100px; height: 1100px; margin-left: -550px; background: radial-gradient(closest-side, rgb(255 236 210 / 0.13), rgb(255 236 210 / 0.04) 55%, transparent 75%); }
  .beam { position: absolute; left: 50%; top: 0; width: 700px; height: 620px; margin-left: -350px; background: linear-gradient(180deg, rgb(255 240 220 / 0.07), transparent 85%); clip-path: polygon(40% 0, 60% 0, 100% 100%, 0 100%); }
  .print { position: absolute; top: 210px; padding: 20px; background: #f2efe8; box-shadow: 0 0 0 8px #161412, 0 70px 110px -40px #000; }
  .print img { display: block; width: 100%; }
  .main { left: 50%; width: 700px; margin-left: -350px; }
  .side { width: 520px; top: 262px; filter: brightness(0.32); }
  .left { left: -300px; }
  .right { right: -300px; }
  .cap { position: absolute; left: 50%; top: 560px; width: 700px; margin-left: -350px; display: flex; justify-content: space-between; align-items: baseline; }
  .cap b { font: 700 18px/1.3 "Manrope"; }
  .cap span { color: #807d77; font: 500 14px/1.3 "Manrope"; }
  .title { position: absolute; left: 40px; top: 92px; font: 800 26px/1 "Montserrat"; letter-spacing: -0.02em; text-transform: uppercase; }
  .title small { display: block; margin-top: 8px; color: #807d77; font: 500 14px/1.4 "Manrope"; letter-spacing: 0; text-transform: none; }
  .count { position: absolute; right: 40px; top: 92px; font: 800 26px/1 "Montserrat"; font-variant-numeric: tabular-nums; }
  .count span { color: #55524d; }
  .nav { position: absolute; left: 50%; top: 646px; transform: translateX(-50%); display: flex; align-items: center; gap: 28px; color: #807d77; font: 600 14px/1 "Manrope"; }
  .nav b { color: #ecebe7; }
  .ticks { position: absolute; left: 50%; top: 692px; transform: translateX(-50%); display: flex; gap: 6px; }
  .ticks i { width: 28px; height: 2px; background: #2c2a27; }
  .ticks i.on { background: #ecebe7; }
  .foot { position: absolute; left: 40px; right: 40px; bottom: 36px; display: flex; justify-content: space-between; align-items: flex-end; padding-top: 22px; border-top: 1px solid rgb(255 255 255 / 0.1); }
  .foot p { font: 800 46px/1 "Montserrat"; letter-spacing: -0.04em; }
  .foot p span { color: #55524d; }
  .foot nav { display: flex; gap: 26px; color: #a8a6a0; font: 600 14px/1 "Manrope"; }
</style>
</head>
<body>
<header class="bar"><b>Haris</b><span class="menu"><i><s></s><s></s></i>Menu</span><nav><span>Email</span><span>LinkedIn</span></nav></header>
<div class="light"></div><div class="beam"></div>
<p class="title">Client reviews<small>33 contracts on Upwork, 100% Job Success</small></p>
<p class="count">03 <span>/ 12</span></p>
<figure class="print side left"><img src="./samples/review-02.png" alt="" /></figure>
<figure class="print main"><img src="./samples/review-03.png" alt="" /></figure>
<figure class="print side right"><img src="./samples/review-01.png" alt="" /></figure>
<div class="cap"><b>Insurance voice agent</b><span>Retell AI, n8n, GoHighLevel</span></div>
<div class="nav"><span>&larr; Previous</span><b>Drag, or use the arrow keys</b><span>Next &rarr;</span></div>
<div class="ticks"><i></i><i></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
<footer class="foot"><p>hello@autoany.io <span>&#8599;</span></p><nav><span>Upwork</span><span>LinkedIn</span><span>Karachi 12:24 PM</span><span>Back to top</span></nav></footer>
</body>
</html>
