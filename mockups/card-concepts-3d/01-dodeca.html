<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Twelve Sides</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./base.css" />
<script type="importmap">{ "imports": { "three": "/landing/vendor/three/build/three.module.min.js", "three/addons/": "/landing/vendor/three/addons/" } }</script>
<style>
  :root { --ink: #eef3f7; --muted: #8a96a3; --ice: #a9dcff; --line: rgb(238 243 247 / 0.14); }
  body { background: #050607; color: var(--ink); }
  .intro { left: 64px; top: 210px; width: 430px; }
  .intro small { font: 700 12px/1 "Manrope"; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ice); }
  .intro h2 { margin-top: 18px; font: 800 64px/0.92 "Montserrat"; letter-spacing: -0.04em; text-transform: uppercase; }
  .intro p { margin-top: 20px; font-size: 16px; line-height: 1.6; color: var(--muted); }
  .pips { left: 64px; bottom: 56px; display: flex; gap: 8px; }
  .pips span { width: 30px; height: 30px; clip-path: polygon(50% 0, 100% 38%, 82% 100%, 18% 100%, 0 38%); background: rgb(238 243 247 / 0.12); display: grid; place-items: center; font: 700 10px/1 "Manrope"; padding-top: 4px; color: var(--muted); }
  .pips span.on { background: var(--ice); color: #06121c; }
  .ctrl { right: 64px; bottom: 50px; display: flex; align-items: center; gap: 14px; font-size: 13px; color: var(--muted); }
  .ctrl i { width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; color: var(--ink); font-style: normal; }
  .ctrl b { color: var(--ink); }
  .chip { padding: 12px 16px; border-radius: 12px; background: rgb(10 14 18 / 0.72); border: 1px solid rgb(169 220 255 / 0.35); backdrop-filter: blur(8px); }
  .chip b { display: block; font: 800 20px/1.1 "Montserrat"; text-transform: uppercase; letter-spacing: -0.01em; }
  .chip span { font-size: 13px; color: var(--muted); }
  .chip em { font-style: normal; color: var(--ice); font: 700 11px/1 "Manrope"; letter-spacing: 0.14em; display: block; margin-bottom: 6px; }
  .lead { height: 1px; background: linear-gradient(90deg, rgb(169 220 255 / 0.8), transparent); transform-origin: 0 0; }
  .shade { right: 0; top: 0; width: 760px; height: 900px; background: linear-gradient(90deg, rgb(5 6 7 / 0), rgb(5 6 7 / 0.85) 28%, rgb(5 6 7 / 0.92)); }
  .detail { right: 64px; top: 150px; width: 560px; }
  .detail small { font: 700 12px/1 "Manrope"; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ice); }
  .detail h1 { margin-top: 16px; font: 800 58px/0.92 "Montserrat"; letter-spacing: -0.04em; text-transform: uppercase; }
  .detail p { margin-top: 22px; font-size: 17px; line-height: 1.6; color: #b8c3cd; }
  .figs { margin-top: 30px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border-radius: 14px; overflow: hidden; }
  .figs div { background: #0b0e11; padding: 18px; }
  .figs b { display: block; font: 800 30px/1 "Montserrat"; letter-spacing: -0.03em; }
  .figs span { display: block; margin-top: 8px; font-size: 12px; color: var(--muted); }
  .stack { margin-top: 24px; display: flex; flex-wrap: wrap; gap: 8px; }
  .stack span { padding: 8px 12px; border-radius: 999px; background: rgb(238 243 247 / 0.07); font-size: 13px; }
  .acts { margin-top: 36px; display: flex; gap: 12px; }
  .acts span { padding: 14px 20px; border-radius: 999px; border: 1px solid var(--line); font: 700 13px/1 "Manrope"; }
  .acts span:first-child { background: var(--ice); color: #06121c; border-color: transparent; }
</style>
</head>
<body>
<canvas id="scene" width="1440" height="900"></canvas>
<header class="bar"><b>Haris</b><nav><span>Email</span><span>LinkedIn</span></nav><span class="menu"><i><s></s><s></s></i>Menu</span></header>
<script type="module">
  import { THREE, stage, tex, cover, loadImg, backdrop, fonts, toScreen, finish, PROJECTS, REF, LOGO, VIEW, PICK, pad, platform, cursor } from './kit.js'

  await fonts(['800 80px Montserrat', '600 30px Manrope', '700 24px Manrope'])
  const { scene, camera, render } = stage({ fov: 35, exposure: 0.95, env: 0.22, bloom: [0.7, 0.5, 0.97] })
  backdrop(scene, '#16202a', '#030405', 0.62, 0.5)
  camera.position.set(0, 0, 9)

  // ---------- the solid: a dodecahedron, one project on each of its 12 faces ----------
  const PHI = (1 + Math.sqrt(5)) / 2
  const V = []
  for (const x of [-1, 1]) for (const y of [-1, 1]) for (const z of [-1, 1]) V.push(new THREE.Vector3(x, y, z))
  const N = []
  for (const a of [-1, 1]) for (const b of [-1, 1]) {
    V.push(new THREE.Vector3(0, a / PHI, b * PHI), new THREE.Vector3(a / PHI, b * PHI, 0), new THREE.Vector3(a * PHI, 0, b / PHI))
    N.push(new THREE.Vector3(a, 0, b * PHI).normalize(), new THREE.Vector3(0, a * PHI, b).normalize(), new THREE.Vector3(a * PHI, b, 0).normalize())
  }
  const SCALE = 1.62 / Math.sqrt(3)
  const faces = N.map((n) => {
    const d = Math.max(...V.map((v) => v.dot(n)))
    const vs = V.filter((v) => Math.abs(v.dot(n) - d) < 1e-3)
    const c = vs.reduce((s, v) => s.add(v), new THREE.Vector3()).divideScalar(5)
    // the face's "up" is the corner nearest the world's up, so the print reads upright
    const ref = new THREE.Vector3(0, 1, 0.3).normalize()
    const refP = ref.clone().addScaledVector(n, -ref.dot(n))
    const top = vs.reduce((best, v) => (v.clone().sub(c).normalize().dot(refP) > best.clone().sub(c).normalize().dot(refP) ? v : best))
    const up = top.clone().sub(c).normalize()
    const right = up.clone().cross(n)
    const basis = new THREE.Matrix4().makeBasis(right, up, n)
    return { n, c, rp: top.clone().sub(c).length() * SCALE, ri: c.length() * SCALE, q: new THREE.Quaternion().setFromRotationMatrix(basis) }
  })
  const RP = faces[0].rp
  const RI = faces[0].ri
  window.__dbg = { RI, RP, list: faces.map((f) => [f.n.toArray().map((x) => x.toFixed(2)).join(','), f.ri.toFixed(3), f.rp.toFixed(3), new THREE.Matrix4().makeRotationFromQuaternion(f.q).determinant().toFixed(2)]) }

  // pentagon tile, apex up; cap UVs come straight from the shape, so the texture is mapped with repeat/offset
  const shape = new THREE.Shape()
  for (let k = 0; k < 5; k++) {
    const a = (k / 5) * Math.PI * 2
    const r = RP * 0.9
    k ? shape.lineTo(Math.sin(a) * r, Math.cos(a) * r) : shape.moveTo(Math.sin(a) * r, Math.cos(a) * r)
  }
  const DEPTH = 0.05
  const BEV = 0.02
  const tileGeo = new THREE.ExtrudeGeometry(shape, { depth: DEPTH, bevelEnabled: true, bevelThickness: BEV, bevelSize: BEV, bevelSegments: 3, curveSegments: 1 })
  const edgeMat = new THREE.MeshStandardMaterial({ color: '#1d2126', roughness: 0.32, metalness: 0.85 })

  const T = 768
  async function faceTex(p, i) {
    const [img, logo] = await Promise.all([loadImg(REF + p.img), loadImg(LOGO + p.logo)])
    return tex(T, T, (c) => {
      const pent = () => {
        c.beginPath()
        for (let k = 0; k < 5; k++) {
          const a = (k / 5) * Math.PI * 2
          c.lineTo(T / 2 + Math.sin(a) * T * 0.5, T / 2 - Math.cos(a) * T * 0.5)
        }
        c.closePath()
      }
      cover(c, img, 0, 0, T, T, 0.5, 0.4)
      const g = c.createLinearGradient(0, T * 0.35, 0, T)
      g.addColorStop(0, 'rgba(4,8,12,0)')
      g.addColorStop(1, 'rgba(4,8,12,0.9)')
      c.fillStyle = g
      c.fillRect(0, 0, T, T)
      // thin inner pentagon line
      c.save()
      c.translate(T / 2, T / 2)
      c.scale(0.8, 0.8)
      c.translate(-T / 2, -T / 2)
      pent()
      c.strokeStyle = 'rgba(200,232,255,0.45)'
      c.lineWidth = 3
      c.stroke()
      c.restore()
      c.textAlign = 'center'
      c.fillStyle = '#a9dcff'
      c.font = '700 26px Manrope'
      c.fillText(pad(i) + ' / 12', T / 2, T * 0.6)
      c.fillStyle = '#fff'
      c.font = `800 ${p.card.length > 8 ? 70 : 84}px Montserrat`
      c.fillText(p.card.toUpperCase(), T / 2, T * 0.71)
      c.fillStyle = 'rgba(255,255,255,0.75)'
      c.font = '600 28px Manrope'
      c.fillText(p.sub, T / 2, T * 0.77)
      // logo on a small disc near the apex
      c.fillStyle = 'rgba(255,255,255,0.94)'
      c.beginPath()
      c.arc(T / 2, T * 0.2, 34, 0, Math.PI * 2)
      c.fill()
      if (logo) c.drawImage(logo, T / 2 - 20, T * 0.2 - 20, 40, 40)
    })
  }
  const texes = await Promise.all(PROJECTS.map(faceTex))

  const solid = new THREE.Group()
  scene.add(solid)
  const tiles = faces.map((f, i) => {
    const map = texes[i]
    map.repeat.set(1 / (2 * RP), 1 / (2 * RP))
    map.offset.set(0.5, 0.5)
    const m = new THREE.MeshPhysicalMaterial({ map, roughness: 0.38, clearcoat: 1, clearcoatRoughness: 0.12, emissive: '#ffffff', emissiveMap: map, emissiveIntensity: 0.02 })
    const mesh = new THREE.Mesh(tileGeo, [m, edgeMat])
    mesh.quaternion.copy(f.q)
    mesh.position.copy(f.n).multiplyScalar(RI - DEPTH - BEV)
    solid.add(mesh)
    return { mesh, m, f }
  })

  // a bright core: light leaks through the seams between the tiles
  const core = new THREE.Mesh(new THREE.IcosahedronGeometry(RI * 0.86, 3), new THREE.MeshBasicMaterial({ color: new THREE.Color(1.3, 1.75, 2.2), toneMapped: false }))
  solid.add(core)

  const key = new THREE.DirectionalLight('#ffffff', 1.5)
  key.position.set(-4, 5, 6)
  scene.add(key)
  const rim = new THREE.DirectionalLight('#7cc4ff', 1.6)
  rim.position.set(5, 2, -4)
  scene.add(rim)

  // soft shadow under the solid
  const shadow = new THREE.Mesh(new THREE.PlaneGeometry(5, 5), new THREE.MeshBasicMaterial({ transparent: true, depthWrite: false,
    map: tex(256, 256, (c) => { const g = c.createRadialGradient(128, 128, 0, 128, 128, 128); g.addColorStop(0, 'rgba(0,0,0,0.75)'); g.addColorStop(1, 'rgba(0,0,0,0)'); c.fillStyle = g; c.fillRect(0, 0, 256, 256) }) }))
  shadow.rotation.x = -Math.PI / 2
  scene.add(shadow)
  // glow pool on the floor from the core
  const pool = new THREE.Mesh(new THREE.PlaneGeometry(4.5, 4.5), new THREE.MeshBasicMaterial({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    map: tex(256, 256, (c) => { const g = c.createRadialGradient(128, 128, 0, 128, 128, 128); g.addColorStop(0, 'rgba(120,190,255,0.16)'); g.addColorStop(1, 'rgba(120,190,255,0)'); c.fillStyle = g; c.fillRect(0, 0, 256, 256) }) }))
  pool.rotation.x = -Math.PI / 2
  scene.add(pool)

  // turn the solid so face i looks at the camera, then tip it so a few neighbours show too
  function present(i, yaw, pitch) {
    solid.quaternion.copy(faces[i].q).invert()
    solid.quaternion.premultiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(pitch, yaw, 0)))
    tiles.forEach((t) => {
      let best = -2
      for (let k = 0; k < 5; k++) {
        const q = t.f.q.clone().multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), (k * Math.PI * 2) / 5))
        const y = new THREE.Vector3(0, 1, 0).applyQuaternion(q).applyQuaternion(solid.quaternion).y
        if (y > best) { best = y; t.mesh.quaternion.copy(q) }
      }
    })
  }

  const ui = (cls, html, style = {}) => {
    const el = document.createElement('div')
    el.className = 'ui ' + cls
    el.innerHTML = html
    Object.assign(el.style, style)
    document.body.appendChild(el)
    return el
  }
  const p = PROJECTS[PICK]

  if (VIEW === 'browse') {
    solid.position.set(1.15, 0.05, 0)
    present(PICK, 0.5, -0.28)
    shadow.position.set(1.15, -2.35, 0)
    pool.position.set(1.15, -2.36, 0)
    // the hovered face lifts out along its normal and brightens
    const t = tiles[PICK]
    t.mesh.position.addScaledVector(t.f.n, 0.32)
    t.m.emissiveIntensity = 0.07
    solid.updateMatrixWorld(true)
    const anchor = toScreen(t.f.n.clone().multiplyScalar(RI + 0.32).applyMatrix4(solid.matrixWorld), camera)
    ui('intro', `<small>Selected work &nbsp;/&nbsp; 12 systems</small><h2>Twelve sides of the work</h2><p>Each face is a system running in production. Drag to turn it, click a face to open the case study.</p>`)
    ui('pips', PROJECTS.map((q, i) => `<span class="${i === PICK ? 'on' : ''}">${i + 1}</span>`).join(''))
    ui('ctrl', `<span>Drag to turn &nbsp;&middot;&nbsp; <b>${pad(PICK)}</b> / 12</span><i>&larr;</i><i>&rarr;</i>`)
    const cx = 1080, cy = 170
    const dx = anchor.x - cx, dy = anchor.y - (cy + 60)
    ui('lead', '', { left: cx + 'px', top: cy + 60 + 'px', width: Math.hypot(dx, dy) + 'px', transform: `rotate(${Math.atan2(dy, dx)}rad)` })
    ui('chip', `<em>FACE ${pad(PICK)}</em><b>${p.card}</b><span>${p.sub}</span>`, { left: cx + 'px', top: cy + 'px' })
    cursor(anchor.x - 30, anchor.y + 30)
  } else {
    // the chosen face has come out of the solid toward you; the rest waits behind with an open slot
    present(PICK, 0.55, -0.15)
    solid.position.set(-1.3, 1.6, -7)
    shadow.position.set(-1.3, -2.6, -7)
    pool.position.set(-1.3, -2.61, -7)
    tiles.forEach((t) => (t.m.emissiveIntensity = 0.02))
    const t = tiles[PICK]
    solid.remove(t.mesh)
    scene.add(t.mesh)
    t.mesh.quaternion.setFromEuler(new THREE.Euler(0.04, 0.22, 0))
    t.mesh.position.set(-2.55, -0.15, 1.2)
    t.mesh.scale.setScalar(1.55)
    t.m.emissiveIntensity = 0.03
    key.position.set(-2, 3, 8)
    ui('shade', '')
    ui('detail', `<small>Face ${pad(PICK)} of 12 &nbsp;/&nbsp; ${p.tag}</small><h1>${p.name}</h1><p>${p.copy}</p>
      <div class="figs">${p.figs.map((f) => `<div><b>${f[0]}</b><span>${f[1]}</span></div>`).join('')}</div>
      <div class="stack">${p.stack.map((s) => `<span>${s}</span>`).join('')}</div>
      <div class="acts"><span>Next face &rarr;</span><span>Back to all twelve</span></div>`)
  }
  await finish(render)
</script>
</body>
</html>
