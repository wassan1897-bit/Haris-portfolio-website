<style>
html, body { margin: 0; background: #fff; overflow: hidden; }

.ph-logos { position: absolute; z-index: 4; overflow: hidden; }
.ph-logos__track { display: flex; align-items: center; gap: var(--logo-gap, 56px); width: max-content; margin: 0; padding: 0; list-style: none; animation: ph-scroll 38s linear infinite; }
.ph-logos__track li { flex: none; }
.ph-logos__track img { display: block; height: var(--logo-h, 22px); width: auto; filter: grayscale(1) contrast(1.1); opacity: 0.55; transition: filter .3s, opacity .3s; }
.ph-logos:hover .ph-logos__track { animation-play-state: paused; }
.ph-logos__track img:hover { filter: none; opacity: 1; }
@keyframes ph-scroll { to { transform: translateX(calc(-50% - var(--logo-gap, 56px) / 2)); } }
@media (prefers-reduced-motion: reduce) { .ph-logos__track { animation: none; } }


.ph-sub { font-family: "Manrope", sans-serif; text-transform: none; letter-spacing: -0.005em; font-size: 19px; line-height: 1.35; gap: 6px; color: #7a7f7d; font-weight: 500; }
.ph-sub p:first-child { color: var(--ph-ink); font-weight: 700; font-size: 21px; margin-bottom: 6px; }
.ph-cta { font-family: "Montserrat", sans-serif; font-size: 12px; text-transform: uppercase; margin-top: 26px; }
/* marquee under the copy, inside the white column */
.ph-logos { left: calc(var(--ph-rail) + 134px); width: calc(var(--ph-panel-left) - var(--ph-rail) - 190px); bottom: 110px; height: 40px; display: flex; align-items: center;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent); mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent); }
.ph-logos { --logo-h: 24px; --logo-gap: 52px; }


.ph-logos__track img { filter: none; opacity: 1; }
.ph-logos__track img:hover { transform: translateY(-2px); }
.ph-logos__track img { transition: transform .3s ease; }

.ph-logos { height: auto; bottom: 70px; display: grid; gap: 22px; --logo-h: 22px; --logo-gap: 54px; }
.ph-logos__track--rev { animation-direction: reverse; animation-duration: 44s; }
</style>
