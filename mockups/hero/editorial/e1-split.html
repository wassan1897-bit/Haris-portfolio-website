<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hero E1: Editorial Split</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800&display=swap" rel="stylesheet" />
<style>
  /* Editorial split: black side column, square portrait straddling the edge, big headline, thin right rail */
  :root { --black: #141414; --white: #ffffff; --ink: #141414; --muted: #77777a; --line: #ececec; --rail: 112px; --side: 25vw; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--white); color: var(--ink); font-family: "DM Sans", system-ui, sans-serif; }
  a { color: inherit; text-decoration: none; }

  .hero { position: relative; min-height: 100dvh; display: grid; grid-template-columns: var(--side) 1fr var(--rail); overflow: hidden; }

  /* left black column */
  .side { background: var(--black); color: #fff; display: flex; flex-direction: column; justify-content: space-between; padding: 56px 0 56px 72px; }
  .logo { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
  .counter { display: flex; flex-direction: column; align-items: flex-start; gap: 14px; font-size: 12px; font-weight: 500; }
  .counter span { writing-mode: vertical-rl; transform: rotate(180deg); }
  .counter i { display: block; width: 1px; height: 96px; background: rgb(255 255 255 / 0.5); margin-left: 6px; }
  .side-links { display: flex; gap: 24px; font-size: 13px; font-weight: 500; }

  /* main */
  .main { position: relative; display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 96px; padding-right: 64px; }
  .photo { position: relative; margin-left: calc(var(--side) * -0.29); width: min(560px, 36vw); aspect-ratio: 1; overflow: hidden; }
  .photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 12%; display: block; }
  .tag { display: inline-block; background: #b9b9bb; color: #fff; font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; padding: 5px 8px; border-radius: 2px; }
  h1 { margin-top: 18px; font-size: clamp(56px, 5.4vw, 88px); line-height: 0.98; letter-spacing: -0.035em; font-weight: 800; }
  .sub { margin-top: 22px; font-size: 15px; line-height: 1.75; color: var(--muted); max-width: 330px; }
  .cta { display: inline-flex; align-items: center; gap: 12px; margin-top: 30px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
  .cta i { display: block; width: 28px; height: 1.5px; background: var(--ink); }
  .proof { margin-top: 44px; display: flex; gap: 34px; }
  .proof b { display: block; font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
  .proof span { font-size: 12px; color: var(--muted); }

  /* right rail */
  .rail { border-left: 1px solid var(--line); display: grid; grid-template-rows: var(--rail) 1fr auto; }
  .grid-btn { background: #f3f3f3; display: grid; place-items: center; }
  .grid-btn svg { width: 14px; height: 14px; }
  .socials { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 56px; }
  .socials a { writing-mode: vertical-rl; font-size: 13px; font-weight: 500; }
  .lang { text-align: center; padding: 0 0 52px; font-size: 13px; font-weight: 500; }

  @media (max-width: 767px) {
    :root { --side: 0px; }
    .hero { display: flex; flex-direction: column; }
    .side { flex-direction: row; align-items: center; padding: 18px 16px 120px; }
    .counter, .side-links { display: none; }
    .side::after { content: "Menu"; font-size: 14px; font-weight: 500; }
    .main { display: block; padding: 0 16px 32px; margin-top: -96px; }
    .photo { margin-left: 0; width: 82%; }
    .text { margin-top: 32px; }
    h1 { font-size: 52px; }
    .rail { display: none; }
    .proof { gap: 22px; }
    .proof b { font-size: 17px; }
  }
</style>
</head>
<body>
<section class="hero">
  <aside class="side">
    <p class="logo">HARIS-</p>
    <div class="counter"><span>01</span><i></i><span>04</span></div>
    <div class="side-links"><a href="#">Work</a><a href="#">Contact</a></div>
  </aside>

  <div class="main">
    <figure class="photo"><img src="../../../public/files-intro/haris-portrait.png" alt="Muhammad Haris" /></figure>
    <div class="text">
      <span class="tag">AI Automation</span>
      <h1>Diagnose<br />first.</h1>
      <p class="sub">I'm Muhammad Haris. I build production AI for operations-heavy businesses: n8n, voice agents, RAG and CRM.</p>
      <a class="cta" href="#">Start a project <i></i></a>
      <div class="proof">
        <p><b>Top Rated Plus</b><span>on Upwork</span></p>
        <p><b>100%</b><span>Job Success</span></p>
        <p><b>23</b><span>systems shipped</span></p>
      </div>
    </div>
  </div>

  <nav class="rail">
    <a class="grid-btn" href="#" aria-label="Menu"><svg viewBox="0 0 14 14" fill="#141414"><circle cx="2" cy="2" r="1.4"/><circle cx="7" cy="2" r="1.4"/><circle cx="12" cy="2" r="1.4"/><circle cx="2" cy="7" r="1.4"/><circle cx="7" cy="7" r="1.4"/><circle cx="12" cy="7" r="1.4"/><circle cx="2" cy="12" r="1.4"/><circle cx="7" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/></svg></a>
    <div class="socials"><a href="#">LinkedIn</a><a href="#">Upwork</a><a href="#">Email</a></div>
    <p class="lang">En</p>
  </nav>
</section>
</body>
</html>
