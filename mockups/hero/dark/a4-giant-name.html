<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hero A4: Giant Name</title>
<link rel="stylesheet" href="_dark.css" />
<style>
  /* Poster title: the name is the headline, set huge across his chest */
  .hero { position: relative; min-height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; }
  .bg { position: absolute; inset: 0; }
  .bg img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 20%; transform: scale(0.84); transform-origin: 50% 0;
    -webkit-mask-image: radial-gradient(ellipse 60% 70% at 50% 40%, #000 55%, transparent 100%); mask-image: radial-gradient(ellipse 60% 70% at 50% 40%, #000 55%, transparent 100%); }
  nav .links { margin-left: auto; margin-right: 32px; }
  .bg::after { content: ""; position: absolute; inset: 0;
    background: radial-gradient(ellipse 30% 55% at 50% 38%, rgb(13 13 14 / 0) 40%, rgb(13 13 14 / 0.55) 100%),
                linear-gradient(0deg, rgb(13 13 14 / 0.85) 0%, rgb(13 13 14 / 0) 40%); }

  .mid { position: relative; z-index: 2; display: flex; justify-content: space-between; align-items: center; padding: 0 var(--pad); }
  .intro { max-width: 380px; }
  .intro h1 { font-size: 30px; line-height: 1.2; letter-spacing: -0.03em; font-weight: 500; }
  .intro h1 span { display: block; color: var(--muted); }
  .ctas { margin-top: 28px; display: flex; gap: 10px; }
  .stats { list-style: none; display: grid; gap: 22px; text-align: right; }
  .stats b { display: block; font-size: 28px; font-weight: 600; letter-spacing: -0.03em; }
  .stats b em { font-style: normal; color: var(--accent); }
  .stats span { font-size: 13px; color: var(--muted); }

  .name { position: relative; z-index: 2; font-size: 21vw; line-height: 0.74; font-weight: 700; letter-spacing: -0.07em; text-align: center; color: var(--ink); margin-bottom: -0.03em; white-space: nowrap; }
  .name span { color: var(--accent); }

  @media (max-width: 767px) {
    .hero { display: flex; flex-direction: column; }
    .bg { position: relative; height: 58vh; order: -1; }
    .bg img { object-position: 52% 10%; transform: none; -webkit-mask-image: none; mask-image: none; }
    nav { position: absolute; top: 0; left: 0; right: 0; }
    .name { order: 0; font-size: 33vw; margin-top: -0.55em; text-align: left; padding-left: 10px; }
    .mid { order: 1; flex-direction: column; align-items: flex-start; gap: 26px; padding-top: 22px; padding-bottom: 32px; }
    .intro h1 { font-size: 24px; }
    .stats { grid-template-columns: repeat(3, auto); gap: 22px; text-align: left; }
    .stats b { font-size: 20px; }
  }
</style>
</head>
<body>
<section class="hero">
  <div class="bg"><img src="../../../public/landing/assets/img/haris-frames/frame-7.0.jpg" alt="Muhammad Haris" /></div>

  <nav>
    <div class="logo">Muhammad Haris</div>
    <div class="links"><a href="#">Work</a><a href="#">How I work</a><a href="#">About</a></div>
    <a class="btn btn--primary btn--sm" href="#">Start a project</a>
    <span class="menu">Menu</span>
  </nav>

  <div class="mid">
    <div class="intro">
      <h1>AI automation consultant. <span>I build n8n, voice and CRM systems that keep running after launch.</span></h1>
      <div class="ctas">
        <a class="btn btn--primary" href="#">Start a project <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 8h10M9 4l4 4-4 4"/></svg></a>
        <a class="btn btn--ghost" href="#">See the work</a>
      </div>
    </div>
    <ul class="stats">
      <li><b>Top Rated <em>Plus</em></b><span>on Upwork</span></li>
      <li><b>100%</b><span>Job Success</span></li>
      <li><b>23</b><span>systems shipped</span></li>
    </ul>
  </div>

  <p class="name" aria-hidden="true">HARIS<span>.</span></p>
</section>
</body>
</html>
