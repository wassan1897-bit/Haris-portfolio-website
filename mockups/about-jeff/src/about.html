<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>About Haris, reference layout</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Urbanist:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root { --ink: #1c1c1e; --mute: #6f6f74; --soft: #b9b9bd; --orange: #f2a33a; }
html, body { width: 1440px; height: 900px; overflow: hidden; background: #f5f5f5; color: var(--ink); -webkit-font-smoothing: antialiased; font-family: "Montserrat", sans-serif; }

.page { position: absolute; inset: 0; background: linear-gradient(180deg, #fbfbfb 0%, #f3f3f3 100%); overflow: hidden; }
/* top corners, like the reference */
.logo { position: absolute; left: 70px; top: 0; width: 78px; height: 84px; background: #111; color: #fff; display: grid; place-items: center; font: 800 26px Montserrat; letter-spacing: -0.02em; z-index: 5; }
.burger { position: absolute; right: 74px; top: 34px; width: 30px; display: grid; gap: 5px; z-index: 5; }
.burger i { display: block; height: 3px; background: #111; }

.copy { position: absolute; left: 190px; top: 210px; width: 640px; z-index: 3; }
.label { font: 700 22px Montserrat; letter-spacing: 0.22em; text-transform: uppercase; }
.name { margin-top: 14px; font: 700 86px/1 Montserrat; letter-spacing: 0.01em; white-space: nowrap; }
.name span { display: block; }
.para { margin-top: 34px; max-width: 470px; font: 500 16px/1.75 Urbanist; letter-spacing: 0.06em; color: #3a3a3e; }
.more { display: inline-flex; align-items: center; gap: 14px; margin-top: 26px; font: 700 14px Montserrat; letter-spacing: 0.12em; color: var(--orange); }
.more i { display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--orange); color: #fff; font: 700 12px/1 Montserrat; font-style: normal; }
.meta { position: absolute; left: 190px; top: 680px; z-index: 3; color: var(--soft); }
.meta .row { display: flex; align-items: center; gap: 18px; font: 600 18px Urbanist; letter-spacing: 0.08em; }
.eq { display: flex; align-items: flex-end; gap: 3px; height: 22px; }
.eq i { display: block; width: 3px; background: var(--soft); }
.dash { width: 30px; height: 2px; background: var(--orange); }
.social { display: flex; gap: 20px; margin-top: 18px; }
.social span { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 4px; border: 2px solid var(--soft); font: 700 10px Montserrat; color: var(--soft); }

/* the bottom bar */
.bar { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; background: var(--orange); z-index: 2; display: flex; align-items: center; color: #fff; }
.bar .down { position: absolute; left: 106px; font: 700 22px Montserrat; }
.bar .nav { position: absolute; left: 330px; display: flex; gap: 14px; }
.bar .nav i { display: grid; place-items: center; width: 36px; height: 36px; border: 2px solid #fff; border-radius: 50%; font: 700 15px/1 Montserrat; font-style: normal; }
.bar .count { position: absolute; right: 74px; font: 700 18px Montserrat; letter-spacing: 0.12em; }

/* Haris, cut out, standing in front of the bar */
.photo { position: absolute; right: 200px; bottom: 0; height: 770px; z-index: 4; }
.photo img { display: block; height: 100%; width: auto; filter: drop-shadow(-26px 18px 34px rgba(0, 0, 0, 0.16)); }
/* soft floor shadow on the wall behind him */
.wallshade { position: absolute; right: 200px; bottom: 40px; width: 560px; height: 640px; border-radius: 50%; background: radial-gradient(closest-side, rgba(0, 0, 0, 0.07), rgba(0, 0, 0, 0)); z-index: 1; }

/* animation states for the storyboard */
body[data-s="1"] .photo, body[data-s="1"] .wallshade { opacity: 0; }
body[data-s="1"] .copy .l2, body[data-s="1"] .copy .l3, body[data-s="1"] .more, body[data-s="1"] .meta { opacity: 0; }
body[data-s="1"] .copy .l1 { clip-path: inset(0 0 0 0); }
body[data-s="1"] .name span:last-child { opacity: 0.25; filter: blur(4px); transform: translateY(18px); }
body[data-s="2"] .photo { clip-path: inset(46% 0 0 0); transform: translateY(70px); }
body[data-s="2"] .wallshade { opacity: 0.4; }
</style>
</head>
<body data-s="3">
<div class="page">
	<div class="logo">MH</div>
	<div class="burger"><i></i><i></i><i></i></div>

	<div class="copy">
		<p class="label l1">About</p>
		<h2 class="name l1"><span>Muhammad</span><span>Haris</span></h2>
		<p class="para l2">Haris is an AI automation engineer in Karachi, building production AI for operations-heavy businesses in the US, the UK and the Middle East.</p>
		<p class="more l3">Read more <i>›</i></p>
	</div>

	<div class="meta">
		<div class="row"><span class="eq"><i style="height:9px"></i><i style="height:16px"></i><i style="height:12px"></i><i style="height:20px"></i><i style="height:7px"></i><i style="height:14px"></i><i style="height:18px"></i></span><span class="dash"></span><span>Available for new projects</span></div>
		<div class="social"><span>in</span><span>Up</span><span>Gh</span><span>@</span></div>
	</div>

	<div class="wallshade"></div>
	<div class="bar">
		<span class="down">↓</span>
		<span class="nav"><i>‹</i><i>›</i></span>
		<span class="count">02 / 06</span>
	</div>
	<figure class="photo"><img src="img/haris-cutout.png" alt="" /></figure>
</div>
<script>
const s = new URLSearchParams(location.search).get('s');
if (s) document.body.dataset.s = s;
</script>
</body>
</html>
