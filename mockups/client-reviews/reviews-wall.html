<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Client Reviews Wall</title>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<script type="importmap">{ "imports": { "three": "/landing/vendor/three/build/three.module.min.js" } }</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1440px; height: 900px; overflow: hidden; }
  body { background: #ebebeb; color: #2a2b2d; font-family: "Urbanist", sans-serif; -webkit-font-smoothing: antialiased; }
  canvas { position: absolute; inset: 0; display: block; }
  .top { position: absolute; left: 64px; right: 64px; top: 50px; z-index: 5; display: flex; justify-content: space-between; align-items: center; font: 500 14px/1 "Urbanist"; color: #4a4b4d; }
  .top .l, .top .r { display: flex; align-items: center; gap: 34px; }
  .top span { display: flex; align-items: center; gap: 9px; }
  .top svg { width: 17px; height: 17px; }
  .stories { position: absolute; left: 64px; bottom: 100px; z-index: 5; }
  .stories i { display: block; width: 28px; height: 28px; margin-bottom: 20px; border-radius: 6px; background: linear-gradient(135deg, #48d65a 0%, #14a800 50%, #0b6a2c 100%); box-shadow: 0 6px 14px -6px rgb(20 120 30 / 0.6); }
  .stories b { display: block; font: 400 31px/1 "Urbanist"; letter-spacing: -0.01em; }
  .stories small { display: block; margin-top: 10px; font: 500 14px/1 "Urbanist"; color: #55575a; }
  .btns { position: absolute; right: 56px; bottom: 60px; z-index: 5; display: grid; gap: 22px; }
  .btn { width: 88px; height: 88px; display: grid; place-items: center; border-radius: 26px; background: #e1e1e1; box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.75); color: #2a2b2d; }
  .btn svg { width: 32px; height: 32px; }
  .pin { position: absolute; z-index: 6; color: #2a2b2d; }
  .pin svg { display: block; width: 18px; height: 18px; margin-bottom: 11px; color: #3a3b3d; }
  .pin b { display: block; font: 400 25px/1.1 "Urbanist"; letter-spacing: -0.01em; white-space: nowrap; }
  .pin small { display: block; margin-top: 7px; font: 500 14px/1.35 "Urbanist"; color: #55575a; }
  .pin.c { text-align: center; transform: translateX(-50%); }
  .pin.c svg { margin-left: auto; margin-right: auto; }
  .quote { position: absolute; z-index: 6; left: 990px; top: 190px; width: 330px; }
  .quote svg { display: block; width: 18px; height: 18px; margin-bottom: 16px; color: #3a3b3d; }
  .quote b { display: block; font: 300 35px/1.15 "Urbanist"; letter-spacing: -0.015em; }
  .quote small { display: block; margin-top: 16px; font: 500 15px/1.4 "Urbanist"; color: #55575a; }
  .quote .stars { margin-top: 18px; color: #f2601b; font-size: 20px; letter-spacing: 3px; }
  .hot { position: absolute; z-index: 6; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; background: rgb(255 96 96 / 0.85); box-shadow: 0 0 0 10px rgb(255 96 96 / 0.16); display: grid; place-items: center; color: #fff; font: 300 26px/1 "Urbanist"; }
  .close { position: absolute; z-index: 6; right: 56px; top: 104px; width: 52px; height: 52px; display: grid; place-items: center; border-radius: 17px; background: #e1e1e1; box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.75); }
  .close svg { width: 18px; height: 18px; }
  .step { position: absolute; z-index: 6; left: 990px; top: 560px; display: flex; align-items: center; gap: 14px; color: #55575a; font: 500 14px/1 "Urbanist"; }
  .step i { position: relative; width: 140px; height: 2px; background: rgb(0 0 0 / 0.1); }
  .step i::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 64%; background: #2a2b2d; }
</style>
</head>
<body>
<canvas id="c" width="1440" height="900"></canvas>
<div class="top">
  <div class="l"><span>Thursday, 8 Oct</span><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>12:24 PM, Karachi</span></div>
  <div class="r"><span>Projects</span><span>Reviews</span><span>Contact</span><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M4 11.5 12 5l8 6.5V20H4z"/></svg></span></div>
</div>
<div class="stories"><i></i><b>Client reviews</b><small>Upwork, 33 contracts, 100% Job Success</small></div>
<div class="btns">
  <span class="btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M14 4h6v6M20 4l-7 7M10 20H4v-6M4 20l7-7"/></svg></span>
  <span class="btn"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="5.5" width="3" height="13" rx="1.2"/><rect x="14" y="5.5" width="3" height="13" rx="1.2"/></svg></span>
</div>

<script type="module">
import * as THREE from 'three'
const OPEN = new URLSearchParams(location.search).get('view') === 'open'

// crop: the part of each review photo shown on its card (source pixels)
const REVIEWS = [
	{ img: './assets/review-amazon-fba.png', crop: [0, 225, 470, 500], title: 'Amazon FBA', sub: 'Lahore, Pakistan' },
	{ img: '/mockups/connect-redesign-2/samples/review-01.png', crop: [0, 12, 560, 250], title: 'Support', sub: 'Sample review' },
	{ img: '/mockups/connect-redesign-2/samples/review-03.png', crop: [0, 12, 560, 290], title: 'Voice agent', sub: 'Sample review' },
	{ img: '/mockups/connect-redesign-2/samples/review-02.png', crop: [0, 12, 560, 220], title: 'Email triage', sub: 'Sample review' },
	{ img: '/mockups/connect-redesign-2/samples/review-05.png', crop: [0, 12, 560, 220], title: 'WhatsApp', sub: 'Sample review' },
]
const SLOTS = [0, 1, -1, 2, -2]

await Promise.all(['400 100px Urbanist', '500 52px Urbanist', '300 40px Urbanist'].map((f) => document.fonts.load(f)))
const load = (s) => new Promise((r) => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = s })
const imgs = await Promise.all(REVIEWS.map((r) => load(r.img)))
const up = await load('/landing/assets/img/tools/upwork.png')

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, preserveDrawingBuffer: true })
renderer.setPixelRatio(1)
renderer.setSize(1440, 900, false)
renderer.toneMapping = THREE.NoToneMapping
renderer.outputColorSpace = THREE.SRGBColorSpace
const scene = new THREE.Scene()
// a long lens from far back: the flat, calm look of the reference
const camera = new THREE.PerspectiveCamera(12, 1440 / 900, 0.1, 100)
camera.position.set(0, 1.26, 9.6)
camera.lookAt(0, 1.3, 0)

const tex = (w, h, draw) => {
	const cv = document.createElement('canvas')
	cv.width = w
	cv.height = h
	draw(cv.getContext('2d'), w, h)
	const t = new THREE.CanvasTexture(cv)
	t.colorSpace = THREE.SRGBColorSpace
	t.anisotropy = 8
	return t
}
const basic = (map, extra = {}) => new THREE.MeshBasicMaterial({ map, ...extra })
const plane = (w, h, m, x, y, z) => {
	const o = new THREE.Mesh(new THREE.PlaneGeometry(w, h), m)
	o.position.set(x, y, z)
	scene.add(o)
	return o
}

// ---------- the wall ----------
plane(8, 5, basic(tex(1600, 1000, (c, w, h) => {
	const g = c.createRadialGradient(w * 0.5, h * 0.25, 0, w * 0.5, h * 0.42, w * 0.62)
	g.addColorStop(0, '#f3f3f3')
	g.addColorStop(1, '#e1e1e1')
	c.fillStyle = g
	c.fillRect(0, 0, w, h)
	const d = c.getImageData(0, 0, w, h)
	for (let i = 0; i < d.data.length; i += 4) {
		const n = (Math.random() - 0.5) * 3
		d.data[i] += n
		d.data[i + 1] += n
		d.data[i + 2] += n
	}
	c.putImageData(d, 0, 0)
})), 0, 1.3, 0)

// ---------- cards: a white print, title and name at the top, the review photo filling the rest ----------
const CW = 0.58
const CH = 0.8
const CY = 1.49
const GAP = 0.78
const shadowTex = tex(256, 320, (c, w, h) => {
	c.filter = 'blur(20px)'
	c.fillStyle = 'rgba(40,40,45,0.55)'
	c.fillRect(46, 70, w - 92, h - 110)
})
function cardTex(r, img) {
	return tex(1040, 1434, (c, w, h) => {
		c.fillStyle = '#fbfbfb'
		c.fillRect(0, 0, w, h)
		if (img) {
			const [sx, sy, sw, sh] = r.crop
			const top = 330
			// every photo is scaled to the card's width, so all reviews read at the same size
			const dw = w - 48
			const dh = Math.min(h - top, (dw * sh) / sw)
			// left-anchored so the review's text starts inside the card; the far edge fades out
			c.drawImage(img, sx, sy, sw, sh, 24, top, dw, dh)
			const gr = c.createLinearGradient(w - 220, 0, w, 0)
			gr.addColorStop(0, 'rgba(251,251,251,0)')
			gr.addColorStop(1, 'rgba(251,251,251,1)')
			c.fillStyle = gr
			c.fillRect(w - 220, top, 220, dh)
			// the photo melts into the card at the top, like the misty prints in the reference
			const g = c.createLinearGradient(0, top - 10, 0, top + 300)
			g.addColorStop(0, 'rgba(251,251,251,1)')
			g.addColorStop(1, 'rgba(251,251,251,0)')
			c.fillStyle = g
			c.fillRect(0, top - 10, w, 310)
		}
		c.textAlign = 'center'
		c.fillStyle = '#2f3032'
		c.font = '400 100px Urbanist'
		c.fillText(r.title, w / 2, 190)
		c.fillStyle = '#55575a'
		c.font = '500 52px Urbanist'
		c.fillText(r.sub, w / 2, 268)
		c.save()
		c.shadowColor = 'rgba(0,0,0,0.3)'
		c.shadowBlur = 22
		c.shadowOffsetY = 5
		c.fillStyle = '#ffffff'
		c.beginPath()
		c.arc(150, h - 150, 68, 0, Math.PI * 2)
		c.fill()
		c.restore()
		if (up) c.drawImage(up, 106, h - 194, 88, 88)
	})
}
REVIEWS.forEach((r, i) => {
	const g = new THREE.Group()
	scene.add(g)
	const sh = new THREE.Mesh(new THREE.PlaneGeometry(CW * 1.3, CH * 1.28), basic(shadowTex, { transparent: true, depthWrite: false }))
	sh.position.set(0.03, -0.05, -0.05)
	g.add(sh)
	const face = new THREE.Mesh(new THREE.PlaneGeometry(CW, CH), basic(cardTex(r, imgs[i]), { transparent: true }))
	g.add(face)
	let s = SLOTS[i]
	if (OPEN && s !== 0) s += Math.sign(s) * 1.35
	g.position.set(s * GAP, CY, 0.06)
	if (OPEN) {
		if (SLOTS[i] === 0) g.visible = false
		face.material.opacity = 0.6
		sh.material.opacity = 0.5
	}
})

// ---------- the opened review: the client's review spreads over the wall and fades into it ----------
if (OPEN) {
	const shot = imgs[0]
	const crop = [0, 225, 600, 210]
	const SW = 1.46
	const SH = (SW * crop[3]) / crop[2]
	const SX = -0.24
	const SY = 1.5
	plane(SW, SH, basic(tex(1800, Math.round((1800 * crop[3]) / crop[2]), (c, w, h) => {
		c.fillStyle = '#ffffff'
		c.fillRect(0, 0, w, h)
		c.drawImage(shot, crop[0], crop[1], crop[2], crop[3], 0, 0, w, h)
		c.globalCompositeOperation = 'destination-in'
		for (const [x0, y0, x1, y1] of [[0, 0, w, 0], [0, 0, 0, h]]) {
			const g = c.createLinearGradient(x0, y0, x1, y1)
			g.addColorStop(0, 'rgba(0,0,0,0)')
			g.addColorStop(0.08, 'rgba(0,0,0,1)')
			g.addColorStop(0.92, 'rgba(0,0,0,1)')
			g.addColorStop(1, 'rgba(0,0,0,0)')
			c.fillStyle = g
			c.fillRect(0, 0, w, h)
		}
	}), { transparent: true }), SX, SY, 0.07)
	plane(SW * 1.3, SH * 1.6, basic(tex(256, 256, (c, w, h) => {
		const g = c.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2)
		g.addColorStop(0, 'rgba(255,255,255,0.8)')
		g.addColorStop(1, 'rgba(255,255,255,0)')
		c.fillStyle = g
		c.fillRect(0, 0, w, h)
	}), { transparent: true, depthWrite: false }), SX, SY, 0.065)

	scene.updateMatrixWorld(true)
	const at = (wx, wy) => {
		const v = new THREE.Vector3(wx, wy, 0.07).project(camera)
		return [(v.x + 1) * 720, (1 - v.y) * 450]
	}
	const L = at(SX - SW / 2, SY + SH / 2)
	const R = at(SX + SW / 2, SY - SH / 2)
	const ico = {
		star: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="m12 3.5 2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>',
		badge: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="10" r="5.5"/><path d="M9 15l-1.5 6L12 19l4.5 2L15 15"/></svg>',
		tag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M3.5 12.5V4.5h8l9 9-8 8z"/><circle cx="8" cy="9" r="1.4"/></svg>',
		flag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>',
	}
	const add = (h) => document.body.insertAdjacentHTML('beforeend', h)
	// the project, above the review; what the client paid and when, below it
	add(`<div class="pin c" style="left:${(L[0] + R[0]) / 2}px;top:${L[1] - 96}px">${ico.tag}<b>AI agent for Amazon wholesale FBA</b><small>Upwork contract, Feb 13 to Feb 20, 2026</small></div>`)
	add(`<div class="pin c" style="left:${L[0] + 120}px;top:${R[1] + 24}px">${ico.star}<b>Rated 5.0</b><small>by the client</small></div>`)
	add(`<div class="pin c" style="left:${(L[0] + R[0]) / 2 + 40}px;top:${R[1] + 24}px">${ico.badge}<b>Endorsed</b><small>Committed to Quality<br />Solution Oriented, Clear Communicator</small></div>`)
	add(`<div class="pin c" style="left:${R[0] - 70}px;top:${R[1] + 24}px">${ico.flag}<b>$220 earned</b><small>Fixed price, client in Lahore</small></div>`)
	// the client's words, on their own beside it
	add(`<div class="quote">${ico.flag.replace('M5 21V4M5 4h11l-2 4 2 4H5', 'M7 7h4v4H7zM13 7h4v4h-4zM9 11c0 3-1 4-3 5M15 11c0 3-1 4-3 5')}<b>“Sameer is highly recommended for AI automation projects using n8n.”</b><p class="stars">★★★★★</p><small>Client in Lahore, Pakistan<br />Review 01 of 12</small></div>`)
	add(`<span class="hot" style="left:${L[0] - 28}px;top:${L[1] + 52}px">+</span>`)
	add(`<span class="close"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/></svg></span>`)
	add(`<p class="step">Next review in 4s <i></i></p>`)
}

// ---------- desk, chair and plant ----------
const lit = (color, roughness = 0.6, metalness = 0) => new THREE.MeshStandardMaterial({ color, roughness, metalness })
scene.add(new THREE.HemisphereLight('#ffffff', '#d8d8d8', 2.3))
const sun = new THREE.DirectionalLight('#ffffff', 1.5)
sun.position.set(-2.5, 4, 6)
scene.add(sun)
const add3 = (geo, m, [x, y, z], rot = [0, 0, 0], parent = scene) => {
	const o = new THREE.Mesh(geo, m)
	o.position.set(x, y, z)
	o.rotation.set(...rot)
	parent.add(o)
	return o
}
const white = lit('#f7f7f7', 0.5)
const DZ = 0.75
add3(new THREE.BoxGeometry(1.5, 0.026, 0.5), white, [0, 0.76, DZ])
for (const sx of [-0.63, 0.63]) for (const t of [0.34, -0.34]) add3(new THREE.BoxGeometry(0.016, 0.82, 0.016), white, [sx + t * 0.12, 0.36, DZ], [0, 0, t])
plane(1.7, 0.3, basic(tex(256, 64, (c, w, h) => {
	c.filter = 'blur(10px)'
	c.fillStyle = 'rgba(40,40,45,0.16)'
	c.fillRect(24, 14, w - 48, h - 34)
}), { transparent: true, depthWrite: false }), 0.04, 0.68, 0.01)

// moulded shell chair, its back to us: a curved surface, narrow at the waist, round at the top
function shellBack(H = 0.4) {
	const U = 36
	const V = 36
	const pos = []
	const idx = []
	for (let i = 0; i <= U; i++) {
		const u = i / U
		let half = 0.165 + 0.07 * Math.sin(u * Math.PI * 0.55)
		if (u > 0.62) half *= Math.pow(Math.max(0, 1 - Math.pow((u - 0.62) / 0.38, 4)), 0.25)
		for (let j = 0; j <= V; j++) {
			const x = (j / V - 0.5) * 2 * half
			pos.push(x, u * H, -1.5 * x * x + 0.07 * u)
		}
	}
	for (let i = 0; i < U; i++) for (let j = 0; j < V; j++) {
		const a = i * (V + 1) + j
		idx.push(a, a + 1, a + V + 1, a + 1, a + V + 2, a + V + 1)
	}
	const g = new THREE.BufferGeometry()
	g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3))
	g.setIndex(idx)
	g.computeVertexNormals()
	return g
}
const shell = new THREE.MeshPhysicalMaterial({ color: '#1a1b1d', roughness: 0.38, clearcoat: 0.8, clearcoatRoughness: 0.22, side: THREE.DoubleSide })
const chair = new THREE.Group()
chair.position.set(-0.04, 0, DZ + 0.52)
scene.add(chair)
add3(shellBack(), shell, [0, 0.49, 0.06], [0, 0, 0], chair)
const seat = add3(new THREE.CylinderGeometry(0.22, 0.2, 0.035, 40), shell, [0, 0.455, -0.12], [0, 0, 0], chair)
seat.scale.set(1, 1, 0.95)
const rod = lit('#121214', 0.35, 0.7)
for (const [lx, lz, a, b] of [[-0.15, 0.02, 0.1, 0.12], [0.15, 0.02, 0.1, -0.12], [-0.15, -0.26, -0.1, 0.12], [0.15, -0.26, -0.1, -0.12]]) add3(new THREE.CylinderGeometry(0.008, 0.008, 0.46, 8), rod, [lx, 0.22, lz], [a, 0, b], chair)
// plant in a copper pot, on the desk to the right of the chair
const plant = new THREE.Group()
plant.position.set(0.36, 0.773, DZ - 0.04)
scene.add(plant)
const pot = new THREE.Mesh(new THREE.SphereGeometry(0.045, 32, 20, 0, Math.PI * 2, Math.PI * 0.35, Math.PI * 0.65), new THREE.MeshPhysicalMaterial({ color: '#e0a07a', metalness: 0.85, roughness: 0.25 }))
pot.position.y = 0.035
plant.add(pot)
const leafMat = new THREE.MeshStandardMaterial({ color: '#2d6f8c', roughness: 0.45, side: THREE.DoubleSide })
for (const [a, h, s] of [[-0.62, 0.13, 1], [0.58, 0.15, 1], [-0.22, 0.2, 0.85], [0.26, 0.22, 0.8], [-0.95, 0.08, 0.8], [0.95, 0.09, 0.85], [0, 0.17, 0.7]]) {
	const l = new THREE.Mesh(new THREE.SphereGeometry(0.05, 20, 12), leafMat)
	l.scale.set(0.42 * s, 1, 0.12)
	l.position.set(Math.sin(a) * 0.06, h, 0)
	l.rotation.set(0, 0, -a)
	plant.add(l)
}
const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.003, 0.003, 0.18, 6), lit('#3c5f43'))
stem.position.y = 0.11
plant.add(stem)

renderer.render(scene, camera)
renderer.render(scene, camera)
window.__ready = true
</script>
</body>
</html>
