<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Desk Render</title>
<script type="importmap">{ "imports": { "three": "/landing/vendor/three/build/three.module.min.js" } }</script>
<style>html, body { margin: 0; background: transparent; } canvas { display: block; }</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
// Renders the desk, chair and plant once, on a transparent background, from the same camera as
// the reviews wall mockup. The page uses the result as a still image.
import * as THREE from 'three'
const S = 2
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, alpha: true, preserveDrawingBuffer: true, premultipliedAlpha: false })
renderer.setPixelRatio(1)
renderer.setSize(1440 * S, 900 * S, false)
renderer.setClearColor(0x000000, 0)
renderer.toneMapping = THREE.NoToneMapping
renderer.outputColorSpace = THREE.SRGBColorSpace
const scene = new THREE.Scene()
const camera = new THREE.PerspectiveCamera(12, 1440 / 900, 0.1, 100)
camera.position.set(0, 1.26, 9.6)
camera.lookAt(0, 1.3, 0)
const lit = (color, roughness = 0.6, metalness = 0) => new THREE.MeshStandardMaterial({ color, roughness, metalness })
scene.add(new THREE.HemisphereLight('#ffffff', '#d8d8d8', 2.3))
const sun = new THREE.DirectionalLight('#ffffff', 1.5)
sun.position.set(-2.5, 4, 6)
scene.add(sun)
const add3 = (geo, m, [x, y, z], rot = [0, 0, 0], parent = scene) => {
	const o = new THREE.Mesh(geo, m)
	o.position.set(x, y, z)
	o.rotation.set(...rot)
	parent.add(o)
	return o
}
const white = lit('#f7f7f7', 0.5)
const DZ = 0.75
add3(new THREE.BoxGeometry(1.5, 0.026, 0.5), white, [0, 0.76, DZ])
for (const sx of [-0.63, 0.63]) for (const t of [0.34, -0.34]) add3(new THREE.BoxGeometry(0.016, 0.82, 0.016), white, [sx + t * 0.12, 0.36, DZ], [0, 0, t])
function shellBack(H = 0.4) {
	const U = 48
	const V = 48
	const pos = []
	const idx = []
	for (let i = 0; i <= U; i++) {
		const u = i / U
		let half = 0.165 + 0.07 * Math.sin(u * Math.PI * 0.55)
		if (u > 0.62) half *= Math.pow(Math.max(0, 1 - Math.pow((u - 0.62) / 0.38, 4)), 0.25)
		for (let j = 0; j <= V; j++) {
			const x = (j / V - 0.5) * 2 * half
			pos.push(x, u * H, -1.5 * x * x + 0.07 * u)
		}
	}
	for (let i = 0; i < U; i++) for (let j = 0; j < V; j++) {
		const a = i * (V + 1) + j
		idx.push(a, a + 1, a + V + 1, a + 1, a + V + 2, a + V + 1)
	}
	const g = new THREE.BufferGeometry()
	g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3))
	g.setIndex(idx)
	g.computeVertexNormals()
	return g
}
const shell = new THREE.MeshPhysicalMaterial({ color: '#1a1b1d', roughness: 0.38, clearcoat: 0.8, clearcoatRoughness: 0.22, side: THREE.DoubleSide })
const chair = new THREE.Group()
chair.position.set(-0.04, 0, DZ + 0.52)
scene.add(chair)
add3(shellBack(), shell, [0, 0.49, 0.06], [0, 0, 0], chair)
add3(new THREE.CylinderGeometry(0.22, 0.2, 0.035, 48), shell, [0, 0.455, -0.12], [0, 0, 0], chair).scale.set(1, 1, 0.95)
const rod = lit('#121214', 0.35, 0.7)
for (const [lx, lz, a, b] of [[-0.15, 0.02, 0.1, 0.12], [0.15, 0.02, 0.1, -0.12], [-0.15, -0.26, -0.1, 0.12], [0.15, -0.26, -0.1, -0.12]]) add3(new THREE.CylinderGeometry(0.008, 0.008, 0.46, 10), rod, [lx, 0.22, lz], [a, 0, b], chair)
const plant = new THREE.Group()
plant.position.set(0.36, 0.773, DZ - 0.04)
scene.add(plant)
const pot = new THREE.Mesh(new THREE.SphereGeometry(0.045, 40, 24, 0, Math.PI * 2, Math.PI * 0.35, Math.PI * 0.65), new THREE.MeshPhysicalMaterial({ color: '#e0a07a', metalness: 0.85, roughness: 0.25 }))
pot.position.y = 0.035
plant.add(pot)
const leafMat = new THREE.MeshStandardMaterial({ color: '#2d6f8c', roughness: 0.45, side: THREE.DoubleSide })
for (const [a, h, s] of [[-0.62, 0.13, 1], [0.58, 0.15, 1], [-0.22, 0.2, 0.85], [0.26, 0.22, 0.8], [-0.95, 0.08, 0.8], [0.95, 0.09, 0.85], [0, 0.17, 0.7]]) {
	const l = new THREE.Mesh(new THREE.SphereGeometry(0.05, 24, 14), leafMat)
	l.scale.set(0.42 * s, 1, 0.12)
	l.position.set(Math.sin(a) * 0.06, h, 0)
	l.rotation.set(0, 0, -a)
	plant.add(l)
}
const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.003, 0.003, 0.18, 6), lit('#3c5f43'))
stem.position.y = 0.11
plant.add(stem)
renderer.render(scene, camera)
window.__png = renderer.domElement.toDataURL('image/png')
</script>
</body>
</html>
