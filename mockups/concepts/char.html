<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Character and Desk Styles</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #ece6da; font-family: "Manrope", sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .label { position: fixed; top: 24px; left: 24px; z-index: 2; display: grid; gap: 6px; padding: 16px 20px; border-radius: 14px; background: rgb(236 230 218 / 0.86); backdrop-filter: blur(8px); }
  body.dark .label { background: rgb(10 10 11 / 0.8); }
  .label b { font: 800 30px/1 "Manrope", sans-serif; letter-spacing: -0.02em; color: var(--ink, #17191a); }
  .label span { font: 500 15px/1.4 "Manrope", sans-serif; color: var(--muted, #5f6361); max-width: 520px; }
  body.dark .label b { --ink: #f3efe8; } body.dark .label span { --muted: #9a958c; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="label"><b id="name"></b><span id="desc"></span></div>
<script type="module" src="./char.js"></script>
</body>
</html>
