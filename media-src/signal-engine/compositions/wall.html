<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    #wall-stage {
      position: absolute;
      inset: 0;
    }
    #wall-cam {
      position: absolute;
      left: 0;
      top: 0;
      width: 1080px;
      height: 1080px;
      transform-origin: 0 0;
    }
    /* a business listing: photo, name, rating, pin + address. No words, so nothing to invent */
    .lc {
      position: absolute;
      width: 186px;
      height: 140px;
      background: #fff;
      border: 2px solid #dbe3df;
      border-radius: 16px;
      box-shadow: 0 10px 24px -14px rgba(17, 26, 23, 0.22);
      /* drawn at the 186 x 140 design size, shown 1.7x so the confirm scene's card matches exactly */
      transform: scale(1.7);
      transform-origin: 0 0;
    }
    .lc i {
      position: absolute;
      display: block;
    }
    .lc .th { left: 16px; top: 16px; width: 40px; height: 40px; border-radius: 10px; background: #dfeee6; }
    .lc .nm { left: 66px; top: 20px; width: 92px; height: 12px; border-radius: 6px; background: #c7d1cc; }
    .lc .sb { left: 66px; top: 40px; width: 64px; height: 10px; border-radius: 5px; background: #e3e9e6; }
    .lc .ad { left: 36px; top: 108px; width: 84px; height: 10px; border-radius: 5px; background: #e3e9e6; }
    .lc .st { position: absolute; left: 16px; top: 72px; display: flex; gap: 4px; }
    .lc .st svg { width: 18px; height: 18px; fill: #e8b23a; }
    .lc .pn { position: absolute; left: 16px; top: 104px; width: 12px; height: 17px; }
    .lc .seen { right: 12px; top: 12px; width: 16px; height: 16px; border-radius: 50%; background: var(--color-ok); }
    .lc .bd { right: -14px; top: -14px; width: 42px; height: 42px; border-radius: 50%; background: var(--color-alert); }
    .lc .bd svg { position: absolute; inset: 0; width: 42px; height: 42px; }
    #wall-scan {
      position: absolute;
      left: 0;
      top: 306px;
      width: 4px;
      height: 774px;
    }
    #wall-scan b {
      position: absolute;
      inset: 0;
      border-radius: 2px;
      background: var(--color-accent);
    }
    #wall-scan s {
      position: absolute;
      right: 4px;
      top: 0;
      width: 170px;
      height: 774px;
      background: linear-gradient(90deg, rgba(14, 122, 85, 0), rgba(14, 122, 85, 0.14));
    }
  </style>
  <div data-hf-id="hf-7lsv" id="root" data-composition-id="wall" data-width="1080" data-height="1080">
    <div data-hf-id="hf-3lzw" id="wall-stage">
      <div data-hf-id="hf-khfi" id="wall-cam" data-layout-allow-overflow>
        <div data-hf-id="hf-m7jp" id="wall-scan"><s data-hf-id="hf-dljm"></s><b data-hf-id="hf-xujp"></b></div>
      </div>
    </div>
  </div>
  <script>
    (() => {
      const STAR =
        '<svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 20.9l1.6-7L2 9.2l7.1-.6z"/></svg>';
      const PIN =
        '<svg class="pn" viewBox="0 0 12 17"><path fill="#9aa6a0" d="M6 0C2.7 0 0 2.6 0 5.9 0 10.3 6 17 6 17s6-6.7 6-11.1C12 2.6 9.3 0 6 0zm0 8.2a2.3 2.3 0 110-4.6 2.3 2.3 0 010 4.6z"/></svg>';
      const BADGE =
        '<i class="bd"><svg viewBox="0 0 42 42"><g class="bang" fill="#fff"><rect x="19" y="9" width="4" height="16" rx="2"/><circle cx="21" cy="31" r="2.6"/></g><g class="pause" fill="#fff" opacity="0"><rect x="14.5" y="12" width="5" height="18" rx="1.5"/><rect x="22.5" y="12" width="5" height="18" rx="1.5"/></g></svg></i>';

      // big listings (316 x 238 on screen), 2 whole ones across with the wall running on past every edge;
      // the scanner stops on column 2, row 1
      const cam = document.getElementById("wall-cam");
      const TC = 2, TR = 1;
      const X0 = 20, X1 = 740.1, S0 = 0.35, S1 = 3.75;
      const cards = [];
      for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 4; c++) {
          const el = document.createElement("div");
          const target = c === TC && r === TR;
          const cx = -110 + c * 346 + 158.1;
          el.className = "lc " + (target ? "target" : "other");
          el.style.left = -110 + c * 346 + "px";
          el.style.top = 330 + r * 268 + "px";
          el.innerHTML =
            '<i class="th"></i><i class="nm"></i><i class="sb"></i><div class="st">' +
            STAR.repeat(5) +
            "</div>" +
            PIN +
            '<i class="ad"></i>' +
            (target ? BADGE : cx <= X1 ? '<i class="seen"></i>' : "");
          cam.appendChild(el);
          cards.push({ el, cx, target });
        }
      }

      const tl = gsap.timeline({ paused: true });
      const tgt = cards.find((c) => c.target).el;
      const stars = [...tgt.querySelectorAll(".st svg")].slice(1);
      const badge = tgt.querySelector(".bd");
      const bang = tgt.querySelector(".bang");
      const pause = tgt.querySelector(".pause");
      const dots = [];

      // 0.35-3.75 the scanner sweeps; every card it passes gets a green dot
      tl.fromTo("#wall-scan", { x: X0, opacity: 1 }, { x: X1, duration: S1 - S0, ease: "none" }, S0);
      for (const c of cards) {
        if (c.target || c.cx > X1) continue;
        const dot = c.el.querySelector(".seen");
        dots.push(dot);
        tl.fromTo(dot, { scale: 0 }, { scale: 1, duration: 0.25, ease: "expo.out" }, S0 + (Math.max(0, c.cx - X0) / (X1 - X0)) * (S1 - S0));
      }

      // 3.8 the trigger: rating drops, the card turns alert
      tl.fromTo("#wall-scan", { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "power3.in", immediateRender: false }, 3.8);
      tl.fromTo(stars, { fill: "#e8b23a" }, { fill: "#d9dfdc", duration: 0.2, stagger: 0.04, ease: "power2.out" }, 3.8);
      tl.fromTo(tgt, { borderColor: "#dbe3df" }, { borderColor: "#d4542f", duration: 0.2, ease: "power2.out" }, 3.8);
      tl.fromTo(badge, { scale: 0 }, { scale: 1, duration: 0.35, ease: "expo.out" }, 3.84);

      // 4.05-5.05 camera pushes in on it (card at 3.2x its design size = 1.7 x 1.8824, centred at 540,600), the rest blur away
      tl.fromTo("#wall-cam", { x: 0, y: 0, scale: 1 }, { x: -853.13, y: -749.65, scale: 1.882353, duration: 1.0, ease: "power2.inOut" }, 4.05);
      tl.fromTo(".lc.other", { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(8px)", duration: 0.6, ease: "power2.out" }, 4.05);

      // 5.6 it holds the lead: the alarm sign becomes a pause sign
      tl.fromTo(bang, { opacity: 1 }, { opacity: 0, duration: 0.12, ease: "power3.in" }, 5.6);
      tl.fromTo(pause, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, 5.68);

      // 7.42 the confirm scene takes the card over at the same spot
      tl.set("#wall-stage", { opacity: 0 }, 7.42);

      // loop: reset while hidden, then the wall returns exactly as frame 0
      tl.set("#wall-cam", { x: 0, y: 0, scale: 1 }, 20.0);
      tl.set(".lc.other", { opacity: 1, filter: "blur(0px)" }, 20.0);
      tl.set(dots, { scale: 0 }, 20.0);
      tl.set(stars, { fill: "#e8b23a" }, 20.0);
      tl.set(tgt, { borderColor: "#dbe3df" }, 20.0);
      tl.set(badge, { scale: 0 }, 20.0);
      tl.set(bang, { opacity: 1 }, 20.0);
      tl.set(pause, { opacity: 0 }, 20.0);
      tl.set("#wall-scan", { x: X0, opacity: 1 }, 20.0);
      tl.fromTo("#wall-stage", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out", immediateRender: false }, 20.2);

      window.__timelines["wall"] = tl;
    })();
  </script>
</template>
