    (() => {
      const TICK = '<svg viewBox="0 0 36 36"><polyline points="10,18.5 15.5,24 26,12.5" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      // score per row, and where each row lands once sorted (rank 1 = highest score)
      const SCORE = [0.55, 0.92, 0.38, 0.81, 0.67, 0.99];
      const order = SCORE.map((s, i) => i).sort((a, b) => SCORE[b] - SCORE[a]);
      const RANK = SCORE.map((s, i) => order.indexOf(i) + 1);
      const col = document.getElementById("pl-col");
      const rows = SCORE.map((s, i) => {
        const el = document.createElement("div");
        el.className = "pl-row";
        el.style.top = i * 100 + "px";
        el.innerHTML = '<span class="rk">' + RANK[i] + '</span><i class="th"></i><i class="nm"></i><i class="sb"></i><i class="tr"></i><i class="fl"></i><i class="ck">' + TICK + "</i>";
        col.appendChild(el);
        return el;
      });
      const fills = rows.map((r) => r.querySelector(".fl"));
      const ranks = rows.map((r) => r.querySelector(".rk"));

      const tl = gsap.timeline({ paused: true });

      // 0-0.6 carry across: the confirmed card shrinks into the first row of the pipeline
      tl.fromTo("#pl-card", { x: 206, y: 0, scale: 1.3, opacity: 1, filter: "blur(0px)" }, { x: -140, y: -226, scale: 0.5, opacity: 0, filter: "blur(6px)", duration: 0.6, ease: "power3.inOut" }, 0);
      tl.fromTo(rows[0], { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.3, ease: "expo.out" }, 0.4);

      // 0.6-1.25 the rest of the pipeline fills
      tl.fromTo(rows.slice(1), { y: -30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "expo.out", stagger: 0.09 }, 0.6);

      // 0.5-2.0 the count lands, then holds
      const num = document.getElementById("pl-num");
      const n = { v: 0 };
      tl.fromTo("#pl-num", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 0.5);
      tl.fromTo(n, { v: 0 }, { v: 51, duration: 1.4, ease: "power2.out", onUpdate: () => (num.textContent = Math.round(n.v)) }, 0.6);

      // 3.8 the count leaves; the list moves to the centre and gets its scores
      tl.fromTo(fills, { scaleX: 0 }, { scaleX: 0, duration: 0.01 }, 0);
      tl.fromTo(ranks, { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
      tl.fromTo("#pl-num", { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(8px)", duration: 0.25, ease: "power3.in", immediateRender: false }, 3.8);
      tl.fromTo("#pl-col", { x: 0 }, { x: 140, duration: 0.6, ease: "power3.inOut" }, 3.9);
      fills.forEach((f, i) => tl.fromTo(f, { scaleX: 0 }, { scaleX: SCORE[i], duration: 0.6, ease: "expo.out", immediateRender: false }, 4.5 + i * 0.05));

      // 5.3-5.9 the rows sort by score, then the ranks land
      rows.forEach((r, i) => tl.fromTo(r, { y: 0 }, { y: (RANK[i] - 1 - i) * 100, duration: 0.6, ease: "power3.inOut", immediateRender: false }, 5.3));
      order.forEach((i, k) => tl.fromTo(ranks[i], { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.15, ease: "power4.out", immediateRender: false }, 6.0 + k * 0.06));

      // 7.3-9.0 nobody touches it: the scanner runs over the ranked list on its own
      tl.fromTo("#pl-scan", { x: 220, opacity: 0 }, { x: 220, opacity: 0, duration: 0.01 }, 0);
      tl.fromTo("#pl-scan", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power2.out", immediateRender: false }, 7.25);
      tl.fromTo("#pl-scan", { x: 220 }, { x: 860, duration: 1.7, ease: "none", immediateRender: false }, 7.3);
      tl.fromTo("#pl-scan", { opacity: 1 }, { opacity: 0, duration: 0.15, ease: "power3.in", immediateRender: false }, 9.0);

      // 9.4 the list blurs out and the wall comes back for the loop
      tl.fromTo("#pl-col", { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(8px)", duration: 0.25, ease: "power3.in", immediateRender: false }, 9.4);

      window.__timelines["pipeline"] = tl;
    })();
